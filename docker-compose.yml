services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upornot
      POSTGRES_USER: upornot
      POSTGRES_PASSWORD: upornot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upornot -d upornot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
